name: Android Build

# The dev sandbox this project has mostly been built in can't reach
# dl.google.com, so :androidApp (AGP, every androidx/Compose artifact, the
# SQLDelight Android driver, and the Android SDK platform itself) has never
# actually been compiled — only reviewed by hand. This workflow is the real
# verification: it runs on a runner with normal internet access, so a red
# check here means an actual compiler error, not a network policy.

on:
  push:
    branches:
      - main
      - 'claude/**'
  pull_request:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: android-build-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: core — unit tests (zero Android SDK on the classpath)
        run: ./gradlew :core:jvmTest --stacktrace

      - name: androidApp — assemble debug APK
        run: ./gradlew :androidApp:assembleDebug --stacktrace

      - name: Upload core test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: core-test-results
          path: core/build/reports/tests/jvmTest
          if-no-files-found: ignore

      - name: Upload debug APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: androidApp-debug-apk
          path: androidApp/build/outputs/apk/debug/*.apk
          if-no-files-found: warn
