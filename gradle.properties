kotlin.mpp.stability.nowarn=true
kotlin.code.style=official
org.gradle.jvmargs=-Xmx2048m
android.useAndroidX=true
android.nonTransitiveRClass=true
# Lets `:core` tasks configure and run without ever touching :androidApp's
# build script — load-bearing in any environment without Android SDK /
# Google Maven access, since :androidApp's plugin block would otherwise be
# evaluated (and fail to resolve) for every Gradle invocation regardless of
# which module's task was actually requested.
org.gradle.configureondemand=true
